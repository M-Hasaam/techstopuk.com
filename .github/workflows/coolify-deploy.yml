name: Coolify Monorepo Deployments

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # 1. WEB APP DEPLOYMENT (apps/web)
  # ----------------------------------------------------
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Web changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

      - name: Trigger Web Deployment
        if: steps.filter.outputs.src == 'true' && secrets.COOLIFY_WEBHOOK_WEB != ''
        run: |
          echo "Triggering Web App deployment on Coolify..."
          curl -s -f -X GET "${{ secrets.COOLIFY_WEBHOOK_WEB }}" && echo "Web deployment triggered successfully!"

  # ----------------------------------------------------
  # 2. ADMIN APP DEPLOYMENT (apps/admin)
  # ----------------------------------------------------
  deploy-admin:
    name: Deploy Admin App
    runs-on: ubuntu-latest
