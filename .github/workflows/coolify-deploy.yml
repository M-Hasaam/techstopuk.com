name: Coolify Monorepo Deployments

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------
  # 0. DETECT PATH CHANGES
  # ----------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
      prisma: ${{ steps.filter.outputs.prisma }}
      scraper: ${{ steps.filter.outputs.scraper }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for App changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            prisma:
              - 'apps/api/prisma/**'
            scraper:
              - 'apps/scraper/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

  # ----------------------------------------------------
  # 0.4. EVALUATE MIGRATION CHECK NECESSITY (~1s)
  # Decision Node in GUI Graph: Checks if Prisma folder changed or RUN_MIGRATION_ALWAYS flag is true
  # ----------------------------------------------------
  eval-migration:
    name: Check Migration Needed?
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.eval.outputs.needed }}
      prisma_changed: ${{ steps.eval.outputs.prisma_changed }}
      flag_active: ${{ steps.eval.outputs.flag_active }}
    steps:
      - name: Evaluate Decision & Print Environment Variables
        id: eval
        run: |
          PRISMA="${{ needs.changes.outputs.prisma }}"
          FLAG="${{ vars.RUN_MIGRATION_ALWAYS || 'false' }}"
          EVENT="${{ github.event_name }}"

          echo "===================================================="
          echo " Prisma Folder Edited : $PRISMA"
          echo " RUN_MIGRATION_ALWAYS  : $FLAG"
          echo " Event Type           : $EVENT"
          echo "===================================================="

          if [ "$PRISMA" = "true" ] || [ "$FLAG" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "➡️ DECISION: Migration check NEEDED -> Routing to DB Migration Check"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "⚡ DECISION: Migration check BYPASSED -> Routing directly to Deploy API App"
          fi
          echo "prisma_changed=$PRISMA" >> $GITHUB_OUTPUT
          echo "flag_active=$FLAG" >> $GITHUB_OUTPUT

  # ----------------------------------------------------
  # 0.5A. PRISMA DB MIGRATION CHECK (~18s - YES Branch)
  # Executed when Check Migration Needed? outputs needed=true
  # ----------------------------------------------------
  check-migrations:
    name: DB Migration Check
    needs: [changes, eval-migration]
    if: needs.eval-migration.outputs.needed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci --ignore-scripts

      - name: Check schema is in sync with migrations
        id: migration_check
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/shadow
          SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/shadow
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Clear RUN_MIGRATION_ALWAYS flag on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set RUN_MIGRATION_ALWAYS --body "false" || echo "Variable update skipped or not created yet"

      - name: Set RUN_MIGRATION_ALWAYS flag on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set RUN_MIGRATION_ALWAYS --body "true" || echo "Variable update skipped or not created yet"

  # ----------------------------------------------------
  # 0.5B. SKIP DB MIGRATION CHECK (~1s - NO / Bypass Branch)
  # Executed when Check Migration Needed? outputs needed=false
  # Creates explicit visual bypass arrow in GitHub Actions GUI Graph
  # ----------------------------------------------------
  skip-migrations:
    name: Skip DB Check (Fast Bypass)
    needs: [changes, eval-migration]
    if: needs.eval-migration.outputs.needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Log Fast Bypass Route
        run: |
          echo "⚡ Migration check bypassed! Routing straight to API deployment (~18s saved)."

  # ----------------------------------------------------
  # 1. WEB APP DEPLOYMENT (apps/web)
  # ----------------------------------------------------
  deploy-web:
    name: Deploy Web App
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Web Deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_WEB secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Web App deployment on Coolify..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Using COOLIFY_TOKEN Bearer authorization..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK") || true
          else
            echo "Warning: COOLIFY_TOKEN is not set. Requesting without auth header..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" "$COOLIFY_WEBHOOK") || true
          fi
          echo "Response from Coolify:"
          echo "$response"
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Web deployment triggered successfully!"
          else
            echo "❌ Coolify returned HTTP $http_code"
            exit 1
          fi

  # ----------------------------------------------------
  # 2. ADMIN APP DEPLOYMENT (apps/admin)
  # ----------------------------------------------------
  deploy-admin:
    name: Deploy Admin App
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Admin Deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_ADMIN }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_ADMIN secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Admin App deployment on Coolify..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Using COOLIFY_TOKEN Bearer authorization..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK") || true
          else
            echo "Warning: COOLIFY_TOKEN is not set. Requesting without auth header..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" "$COOLIFY_WEBHOOK") || true
          fi
          echo "Response from Coolify:"
          echo "$response"
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Admin deployment triggered successfully!"
          else
            echo "❌ Coolify returned HTTP $http_code"
            exit 1
          fi

  # ----------------------------------------------------
  # 3. API APP DEPLOYMENT (apps/api)
  # ----------------------------------------------------
  deploy-api:
    name: Deploy API App
    needs: [changes, eval-migration, check-migrations, skip-migrations]
    if: (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch') && always() && needs.check-migrations.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API Deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_API secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering API App deployment on Coolify..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Using COOLIFY_TOKEN Bearer authorization..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK") || true
          else
            echo "Warning: COOLIFY_TOKEN is not set. Requesting without auth header..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" "$COOLIFY_WEBHOOK") || true
          fi
          echo "Response from Coolify:"
          echo "$response"
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ API deployment triggered successfully!"
          else
            echo "❌ Coolify returned HTTP $http_code"
            exit 1
          fi

  # ----------------------------------------------------
  # 4. SCRAPER APP DEPLOYMENT (apps/scraper)
  # ----------------------------------------------------
  deploy-scraper:
    name: Deploy Scraper App
    needs: changes
    if: needs.changes.outputs.scraper == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper Deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_SCRAPER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_SCRAPER secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Scraper deployment on Coolify..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Using COOLIFY_TOKEN Bearer authorization..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK") || true
          else
            echo "Warning: COOLIFY_TOKEN is not set. Requesting without auth header..."
            response=$(curl -s -S -m 120 --connect-timeout 15 -w "\nHTTP_CODE:%{http_code}" "$COOLIFY_WEBHOOK") || true
          fi
          echo "Response from Coolify:"
          echo "$response"
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Scraper deployment triggered successfully!"
          else
            echo "❌ Coolify returned HTTP $http_code"
            exit 1
          fi
