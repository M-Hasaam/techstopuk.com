          echo "Triggering Admin App deployment on Coolify..."
          curl -s -f -X GET "$COOLIFY_WEBHOOK" && echo "Admin deployment triggered successfully!"

  # ----------------------------------------------------
  # 3. API APP DEPLOYMENT (apps/api)
