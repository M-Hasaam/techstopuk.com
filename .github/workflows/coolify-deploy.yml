        uses: actions/checkout@v4

      - name: Check for API changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

      - name: Trigger API Deployment
        if: steps.filter.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_API secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering API App deployment on Coolify..."
          curl -s -f -X GET "$COOLIFY_WEBHOOK" && echo "API deployment triggered successfully!"

  # ----------------------------------------------------
  # 4. SCRAPER APP DEPLOYMENT (apps/scraper)
  # ----------------------------------------------------
  deploy-scraper:
    name: Deploy Scraper App
    runs-on: ubuntu-latest
