name: Coolify Monorepo Deployments

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  # ----------------------------------------------------
  # 1. WEB APP DEPLOYMENT (apps/web)
  # ----------------------------------------------------
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Web changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

      - name: Trigger Web Deployment
        if: steps.filter.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_WEB secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Web App deployment on Coolify..."
          curl -s -f -X GET "$COOLIFY_WEBHOOK" && echo "Web deployment triggered successfully!"

  # ----------------------------------------------------
  # 2. ADMIN APP DEPLOYMENT (apps/admin)
  # ----------------------------------------------------
