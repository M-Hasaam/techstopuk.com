name: Coolify Monorepo Deployments

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. WEB APP DEPLOYMENT (apps/web)
  # ----------------------------------------------------
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Web changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

      - name: Trigger Web Deployment
        if: steps.filter.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Warning: COOLIFY_WEBHOOK_WEB secret is not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Web App deployment on Coolify..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Using COOLIFY_TOKEN Bearer authorization..."
            response=$(curl --connect-timeout 15 --max-time 45 -s -S -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          else
            echo "Warning: COOLIFY_TOKEN is not set. Requesting without auth header..."
            response=$(curl --connect-timeout 15 --max-time 45 -s -S -w "\nHTTP_CODE:%{http_code}" "$COOLIFY_WEBHOOK")
          fi
          echo "$response"
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Web deployment triggered successfully!"
          else
            echo "❌ Coolify returned HTTP $http_code"
            exit 1
          fi

